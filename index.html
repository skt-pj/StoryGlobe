<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StoryGlobe</title>
  <meta name="description" content="Fly from a satellite globe to a story location and export the flight as MP4.">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cesium@1.145/Build/Cesium/Widgets/widgets.css">
  <link rel="stylesheet" href="./styles.css?v=20260920-5">
  <script>
    window.CESIUM_BASE_URL = "https://cdn.jsdelivr.net/npm/cesium@1.145/Build/Cesium/";
  </script>
  <script src="https://cdn.jsdelivr.net/npm/cesium@1.145/Build/Cesium/Cesium.js"></script>
</head>
<body>
  <main id="app" class="app">
    <div id="cesiumContainer" aria-label="3D satellite globe"></div>

    <header class="topbar">
      <div>
        <p class="eyebrow">WORLD TO STORY</p>
        <h1>StoryGlobe</h1>
      </div>
      <button id="homeButton" class="secondary" type="button">地球全景</button>
    </header>

    <section class="panel" aria-label="Story destination controls">
      <label>
        <span>地点名</span>
        <input id="nameInput" type="text" value="ネッシー" autocomplete="off" readonly>
      </label>

      <div class="grid-two">
        <label>
          <span>緯度</span>
          <input id="latInput" type="number" step="0.000001" min="-90" max="90" value="57.2741223" readonly>
        </label>
        <label>
          <span>経度</span>
          <input id="lonInput" type="number" step="0.000001" min="-180" max="180" value="-4.4849684" readonly>
        </label>
      </div>

      <div class="grid-two">
        <label>
          <span>到着高度 (m)</span>
          <input id="heightInput" type="number" step="1000" min="1000" value="350000">
        </label>
        <label>
          <span>移動時間 (秒)</span>
          <input id="durationInput" type="number" step="0.1" min="0.5" max="30" value="5">
        </label>
      </div>

      <div class="grid-two">
        <label>
          <span>出力幅 (px)</span>
          <input id="widthInput" type="number" step="1" min="1" value="1920">
        </label>
        <label>
          <span>出力高さ (px)</span>
          <input id="heightOutputInput" type="number" step="1" min="1" value="1080">
        </label>
      </div>

      <label>
        <span>動画URL</span>
        <input id="videoInput" type="url" placeholder="https://.../movie.mp4">
      </label>

      <button id="playButton" class="primary" type="button">開始してMP4出力</button>
      <p id="status" class="status" role="status">準備完了</p>
    </section>

    <div class="credit">Imagery: NASA Blue Marble / Esri World Imagery</div>

    <div id="preloadOverlay" class="preload-overlay" aria-hidden="true">
      <div class="preload-overlay__content">
        <div class="preload-spinner" aria-hidden="true"></div>
        <p id="preloadText">経路を事前読み込み中</p>
      </div>
    </div>

    <div id="transitionFlash" class="transition-flash" aria-hidden="true"></div>

    <section id="videoOverlay" class="video-overlay" aria-hidden="true">
      <div class="video-shell">
        <video id="storyVideo" playsinline controls preload="metadata"></video>
        <div class="video-meta">
          <div>
            <p class="eyebrow">NOW PLAYING</p>
            <h2 id="videoTitle">Story</h2>
          </div>
          <button id="closeVideoButton" class="secondary" type="button">地球へ戻る</button>
        </div>
      </div>
    </section>
  </main>

  <script src="./app.js?v=20260920-5"></script>
</body>
</html>
