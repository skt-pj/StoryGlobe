name: Python download E2E

on:
  push:
    paths:
      - ".github/workflows/python-download-e2e.yml"

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install chromium

      - name: Show browser availability
        run: |
          which google-chrome || true
          which chromium || true
          google-chrome --version || true

      - name: Generate MP4 through Python helper
        run: |
          mkdir -p output
          python scripts/download_storyglobe.py output/e2e.mp4 \
            --prev2-name ネッシー \
            --prev2-lat 57.2741223 \
            --prev2-lon -4.4849684 \
            --prev-name チュパカブラ \
            --prev-lat 18.374 \
            --prev-lon -65.899 \
            --name ビッグフット \
            --lat 41.252 \
            --lon -123.632 \
            --height 350000 \
            --duration 0.5 \
            --width 640 \
            --output-height 360 \
            --timeout 900

      - name: Verify downloaded MP4
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("output/e2e.mp4")
          if not p.exists():
              raise SystemExit("MP4 was not downloaded")
          size = p.stat().st_size
          if size < 10000:
              raise SystemExit(f"MP4 too small: {size}")
          data = p.read_bytes()[:64]
          if b"ftyp" not in data:
              raise SystemExit("MP4 ftyp box not found")
          print(f"E2E_OK path={p} bytes={size}")
          PY
